<!DOCTYPE html>
<html lang="en">

<!--Metadata of html/page-->
<head>
    <!-- font library -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Momo+Trust+Display&family=Short+Stack&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <title>Momentum</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <!-- JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script> 
    <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script defer src="js/app.js"></script>
</head>


<body>
<main>

    <div id="main-title">
        <h1 id="app-title">Momentum</h1>
        <h2 id="app-subtitle">Personal Todo List</h2>
    </div>

    <div class="content">

        <section class= "main-display">
        
            <div id="upcoming-panel">
                <h3>To Complete</h3>
                <div id="next-task">Loading...</div>
            </div>

            <div class="task-panel">
                <div id="tabs-display"></div>
                <ul id="task-list"></ul>
            </div>

        </section>


        <div id="edit-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
            <div style="background:white; border-radius:15px; padding:32px; width:320px; display:flex; flex-direction:column; gap:12px;">
                <h3 style="margin:0; font-size:18px;">Edit Task</h3>
                <input type="text" id="edit-title-input" placeholder="Task title">
                <input type="text" id="edit-deadline-input" placeholder="Deadline">
                <select id="edit-category-select">
                    <option value="">No category</option>
                </select>
                <div style="display:flex; gap:8px; justify-content:flex-end;">
                    <button id="edit-cancel-btn">Cancel</button>
                    <button id="edit-save-btn">Save</button>
                </div>
            </div>
        </div>

        <aside class="form-column">
            <form id="add-task-form" autocomplete="off">
                <input type="text" id="title-input" placeholder="Task title" required>
                <input type="text" id="deadline-input" placeholder="Deadline" required>
                <select id="category-select">
                    <option value="">No category</option>
                </select>
                <input type="text" id="category-new-input" placeholder="New category name" style="display:none;">
                <button type="submit">Add</button>
            </form>

            <section class="category-panel">
                <form id="add-category-form" autocomplete="off">
                    <input type="text" id="category-name-input" placeholder="New category" required>
                    <button type="submit">+ Category</button>
                </form>
                <details id="category-dropdown">
                    <summary>Categories</summary>
                    <ul id="category-list"></ul>
                </details>
            </section>
        </aside>
    </div>


</main>
</body>
</html>
