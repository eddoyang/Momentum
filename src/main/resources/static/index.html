<!DOCTYPE html>
<html lang="en">

<!--Metadata of html/page-->
<head>
    <!-- font library -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Momo+Trust+Display&family=Short+Stack&display=swap" rel="stylesheet">

    <!-- calendar  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>

    <!-- drag interaction -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <meta charset="UTF-8">
    <title>Momentum</title>
    <style>
        * {
            box-sizing: border-box;  /* sizing for everything */
        }

        html, body {
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        /* Momentum Header */
        h1 {
            margin: 0 0 4px 0;
            font-size: 28px;
            line-height: 1.2;
            text-align:left;
        }

        /* Momentum Subheader */
        h2 {
            margin: 0 0 32px 12px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.2;
        }

        /*------------- background -------------*/
        body {
            margin: 0; /* space outside element- */
            padding: 40px; /* space inside element (gap between edges) */
            color: black;    /* element color */
            background-color: #cfcfcf; /* background color */
            line-height: 1.5; /* height between elements */
            font-family: "Elms Sans", sans-serif; /* default font */
        }

        /*------------- foreground -------------*/
        /* container of content */
        .container {
            height: calc(100vh - 80px); /* viewport height - 2*background padding (account for initial pad) */
            padding: 50px;
            background-color: #f1f1f1;
            border-radius: 30px;
            border: 2px double #ffffff;
        }

        /* all task content */
        .task-content {
            display: flex;              /* arrange children in a row */
            gap: 24px;                  /* space between the two columns */
            max-width: 1100px;          /* width of content */
            margin: 0 auto;             /* center */
            padding: 24px;              /* space between container and content */

            /* for future ref: If I want to surround the task content */
            /*border: 2px double #d5d5d5;*/
            /*border-radius: 15px;*/
            /*background-color: #f6f6f6;*/
        }




        /*------------- Tasks body -------------*/
        .task-panel {
            flex: 1;                  /* take all remaining space */
            border: 1px solid #ffffff;
            border-radius: 15px;
            padding: 40px;
            background-color: white;
        }

        #category-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid #ededed;
        }
        .category-tab {
            font-family: "Short Stack", cursive;
            font-size: 13px;
            padding: 8px 16px;
            border: 2px solid #ededed;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            background-color: #f6f6f6;
            color: #888;
            cursor: pointer;
            margin-bottom: -2px;
        }

        .category-tab.active {
            background-color: white;
            color: black;
            border-bottom: 2px solid white;
        }

        /*------------- Task adding form -------------*/
        .form-column {
            width: 280px;
        }

        #add-task-form {
            flex-direction: column;
            display: flex;              /* lay elements row format (default) */
            gap: 8px;                   /* gap between elements */
            margin-bottom: 24px;        /* gap between task form and list */
            background-color: white;
            border: 1px solid #dddfff;
            border-radius: 15px;
            padding: 16px;
        }

        /* Task info boxes */
        #add-task-form input,
        #add-task-form select,
        #add-task-form button {
            padding: 8px;   /* size of border/boxes */
            background-color: #f6f6f6;
            border: 1px solid #c1c1c1; /* border attributes */
            border-radius: 15px; /* radius of boxes (makes round) */
            font-size: 14px;     /* size of text font */
            font-family: inherit;  /* match the body font */
        }

        /* Task add button */
        #add-task-form button {
            background-color: #face5c;
            color: #ffffff;
            border: none;
            cursor: pointer; /* make cursor pointer when hovering */
        }
        #add-task-form button:hover {
            background-color: #ffb300;
        }

        /*------------- Category form -------------*/
        .category-panel {
            flex-direction: column;
            display: flex;              /* lay elements row format (default) */
            gap: 8px;                   /* gap between elements */
            margin-bottom: 24px;        /* gap between task form and list */
            background-color: white;
            border: 1px solid #dddfff;
            border-radius: 15px;
            padding: 16px;
        }

        /* Add category button */
        #add-category-form button {
            padding: 8px;
            border: none;
            border-radius: 15px;
            font-family: inherit;
            font-size: 10px;
            color: #ffffff;
            background-color: #face5c;
            cursor: pointer;
        }

        #add-category-form button:hover {
            background-color: #ffb300;
        }

        /* Category lists */
        #category-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        #category-list li {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 0 0 6px 0;
        }

        #category-list li span {
            flex: 1;          /* name takes the leftover space, shoving the button right */
        }

        /* Category lists: delete */
        #category-list button {
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            color: #ffffff;
            background-color: #f19898;
            cursor: pointer;
        }
        #category-list button:hover {
            background-color: #dd8c8c;
        }

        /* category dropdown */
        #category-dropdown {
            margin-top: 4px;
        }

        #category-dropdown summary {
            font-family: "Short Stack", cursive;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 0;
            list-style: none;
        }
        #category-dropdown summary::after {
            content: " ▾";
        }
        #category-dropdown[open] summary::after {
            content: " ▴";
        }

        /*------------- Upcoming task -------------*/
        #next-task {
            background-color: #f6f6f6;
            border: 2px double #e4e4e4;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }
        /* upcoming task header (h2) */
        #next-task h3 {
            font-family: "Short Stack", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 14px;
            text-transform: uppercase;
            color: #666;
            margin: 0 0 8px 0;
        }
        /* content of upcoming task */
        #next-task-content {
            font-size: 18px;
            font-weight: 600;
        }

        /*------------- List of Tasks -------------*/
        #task-list {
            list-style: none;       /* remove bullets */
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;        /* scrollbar if content overflows */
        }
        /* individual tasks */
        #task-list li {
            font-family: "Cantarell", sans-serif;
            font-weight: lighter;
            font-size: clamp(0.6rem, 0.9vw, 0.9rem);
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f6f6f6;
            border: 2px solid #ededed;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }
        #task-list li span {
            flex: 1;    /* take up remaining space, pushing buttons right */
        }

        /* complete/delete buttons */
        #task-list button {
            font-family: "Short Stack", cursive;
            padding: 4px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .complete-btn {
            background-color: #a9ffa9;
        }
        .complete-btn:hover {
            background-color: #9be89a;
        }
        .delete-btn {
            background-color: #f19898;
        }
        .delete-btn:hover {
            background-color: #dd8c8c;
        }

        .edit-btn {
            background-color: #ffcf76;
        }
        .edit-btn:hover {
            background-color: #edc16d;
        }

        /* hide the modal until editTask() is called */
        #edit-modal { display: none; }
        #edit-modal.visible { display: flex; }



    </style>
</head>

<!--the body of the html/page-->
<body>
<main class="container">
    <h1>Momentum</h1>
    <h2>Personal Todo List</h2>

<!--content-->
    <div class="task-content">

        <!--tasks body-->
        <div class="task-panel">
            <!--upcoming task-->
            <section id="next-task">
                <h3>To Complete</h3>
                <div id="next-task-content">Loading...</div>
            </section>

            <div id="category-tabs"></div>
            <ul id="task-list"></ul>
        </div>

        <!--tasks display-->
        <div id="edit-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
            <div style="background:white; border-radius:15px; padding:32px; width:320px; display:flex; flex-direction:column; gap:12px;">
                <h3 style="margin:0; font-size:18px;">Edit Task</h3>
                <input type="text" id="edit-title-input" placeholder="Task title">
                <input type="text" id="edit-deadline-input" placeholder="Deadline">
                <select id="edit-category-select">
                    <option value="">No category</option>
                </select>
                <div style="display:flex; gap:8px; justify-content:flex-end;">
                    <button id="edit-cancel-btn">Cancel</button>
                    <button id="edit-save-btn">Save</button>
                </div>
            </div>
        </div>

        <!--HTML form for adding task-->
        <aside class="form-column">
            <form id="add-task-form" autocomplete="off">
                <input type="text" id="title-input" placeholder="Task title" required>
                <input type="text" id="deadline-input" placeholder="Deadline" required>
                <select id="category-select">
                    <option value="">No category</option>
                </select>
                <input type="text" id="category-new-input" placeholder="New category name" style="display:none;">
                <button type="submit">Add</button>
            </form>

            <section class="category-panel">
                <form id="add-category-form" autocomplete="off">
                    <input type="text" id="category-name-input" placeholder="New category" required>
                    <button type="submit">+ Category</button>
                </form>
                <details id="category-dropdown">
                    <summary>Categories</summary>
                    <ul id="category-list"></ul>
                </details>
            </section>
        </aside>



    </div>
</main>

<script>
    // ---------- State ----------
    let nextTaskTitle = null;
    let nextTaskDeadline = null;
    let allTasks = [];
    let activeCategory = 'All';
    let allCategories = [];
    let tabSortable = null;

    // ---------- Rendering ----------
    async function loadTasks() {

        // // testing purposes
        // const data = {
        //     tasks: [
        //         { id: '1', title: 'Finish CPSC lab',     deadline: '2026-04-25T14:00Z[UTC]' },
        //         { id: '2', title: 'Read Chapter 4',      deadline: '2026-04-25T20:30Z[UTC]' },
        //         { id: '3', title: 'Prep slides',         deadline: '2026-04-26T09:00Z[UTC]' },
        //         { id: '4', title: 'Email professor',     deadline: '2026-04-27T15:45Z[UTC]' },
        //         { id: '1', title: 'Finish CPSC lab',     deadline: '2026-04-25T14:00Z[UTC]' },
        //         { id: '2', title: 'Read Chapter 4',      deadline: '2026-04-25T20:30Z[UTC]' },
        //         { id: '3', title: 'Prep slides',         deadline: '2026-04-26T09:00Z[UTC]' },
        //         { id: '4', title: 'Email professor',     deadline: '2026-04-27T15:45Z[UTC]' },
        //         { id: '5', title: 'Submit assignment 3', deadline: '2026-04-28T23:59Z[UTC]' }
        //     ]
        // };

        const response = await fetch('/api/tasks');
        const data = await response.json();
        allTasks = data.tasks;
        renderTaskList();
    }

    function renderTabs() {
        const tabBar = document.getElementById('category-tabs');
        tabBar.innerHTML = '';

        const categories = ['All', ...allCategories];

        // fall back to ALL if no categories
        if (!categories.includes(activeCategory)) activeCategory = 'All';

        for (const category of categories) {
            const tab = document.createElement('button');
            tab.textContent = category;
            tab.classList.add('category-tab');

            if (category === 'All')
                tab.dataset.fixed = 'true';

            if (category === activeCategory) tab.classList.add('active');
            tab.addEventListener('click', () => {
                activeCategory = category;
                renderTabs();
                renderTaskList();
            });

            if (tabSortable) tabSortable.destroy();

            tabSortable = new Sortable(tabBar, {
                animation: 150,
                filter: '[data-fixed]',
                onMove: (evt) => !evt.related.dataset.fixed,
                onEnd: async () => {
                    const order = [...tabBar.querySelectorAll('.category-tab')]
                        .map(t => t.textContent)
                        .filter(name => name !== 'All');
                    allCategories = order;
                    await fetch('/api/tasks/categories/order', {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({order})
                    });
                }
            });

            tabBar.appendChild(tab);
        }
    }

    function renderTaskList() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';

        const visible = allTasks.filter(task =>
        activeCategory === 'All' || (task.category || 'Uncategorized') === activeCategory
        );

        for (const task of visible) {
            const li = document.createElement('li');


            const text = document.createElement('span');
            text.textContent = `${task.title} — due ${formatDeadline(task.deadline)}`;
            li.appendChild(text);

            //complete button
            const completeButton = document.createElement('button');
            completeButton.textContent = 'Complete';
            completeButton.classList.add('complete-btn');
            completeButton.addEventListener('click', () => completeTask(task.id));
            li.appendChild(completeButton);

            //delete button
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.classList.add('delete-btn');
            deleteButton.addEventListener('click', () => deleteTask(task.id));
            li.appendChild(deleteButton);

            //edit button
            const editButton = document.createElement('button');
            editButton.textContent = 'Edit';
            editButton.classList.add('edit-btn');
            editButton.addEventListener('click', () => editTask(task.id, task.title, task.deadline, task.category));
            li.appendChild(editButton);

            list.appendChild(li);
        }
    }

    async function loadNextTask() {
        const response = await fetch('/api/tasks/next');
        const data = await response.json();

        if (!data.title) {
            nextTaskTitle = null;
            nextTaskDeadline = null;
        } else {
            nextTaskTitle = data.title;
            nextTaskDeadline = new Date(data.deadline.replace(/\[.*\]/, ''));
        }

        updateCountdown();
    }

    async function loadCategories() {
        const response = await fetch('/api/tasks/categories');
        const { categories } = await response.json();

        allCategories = categories;
        renderTabs();

        const select = document.getElementById('category-select');
        const previous = select.value;

        select.innerHTML = '';
        select.appendChild(new Option('No category', ''));


        const editSelect = document.getElementById('edit-category-select');

        editSelect.innerHTML = '';
        editSelect.appendChild(new Option('No category', ''));

        for (const category of categories) {
            select.appendChild(new Option(category, category));
            editSelect.appendChild(new Option(category, category));
        }


        const list = document.getElementById('category-list');
        list.innerHTML = '';

        for (const category of categories) {
            const li = document.createElement('li');
            const span = document.createElement('span');
            span.textContent = category;
            const del = document.createElement('button');
            del.textContent = 'x'
            del.addEventListener('click', () => deleteCategory(category));
            li.append(span, del);
            list.appendChild(li);
        }
    }

    document.getElementById('add-category-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('category-name-input').value.trim();

        if (!name)
            return;

        await fetch('/api/tasks/categories', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name})
        });
        e.target.reset();
        loadCategories();
    });

    async function deleteCategory(name) {
        await fetch(`/api/tasks/categories/${encodeURIComponent(name)}`, { method: 'DELETE' });
        loadCategories();
        loadTasks();
    }


    const deadlinePicker = flatpickr("#deadline-input", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: false
    });

    // ---------- API actions ----------
    async function completeTask(taskId) {
        await fetch(`/api/tasks/${taskId}/complete`, { method: 'PATCH' });
        loadTasks();
        loadNextTask();
    }

    async function deleteTask(taskId) {
        await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
        loadTasks();
        loadNextTask();
    }



    // ---------- Edit Form ----------
    let editingTaskId = null;

    function editTask(taskId, currentTitle, currentDeadline, currentCategory) {
        editingTaskId = taskId;
        document.getElementById('edit-title-input').value = currentTitle;

        const cleaned = currentDeadline.replace(/\[.*\]/, '');
        editDeadlinePicker.setDate(new Date(cleaned));

        document.getElementById('edit-category-select').value = currentCategory || '';
        document.getElementById('edit-modal').classList.add('visible');
    }

    // Cancel Edits
    document.getElementById('edit-cancel-btn').addEventListener('click', () => {
        document.getElementById('edit-modal').classList.remove('visible');
    });

    // Save Edits
    document.getElementById('edit-save-btn').addEventListener('click', async () => {
        const title = document.getElementById('edit-title-input').value;
        const deadline = editDeadlinePicker.selectedDates[0].toISOString().replace('Z', 'Z[UTC]');
        const category = document.getElementById('edit-category-select').value || null;

        await fetch(`/api/tasks`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: editingTaskId, title, deadline, category})
        });

        document.getElementById('edit-modal').classList.remove('visible');
        loadTasks();
        loadNextTask();
    });

    // edit -> deadline calendar
    const editDeadlinePicker = flatpickr("#edit-deadline-input", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: false
    });

    // ---------- Form submission ----------
    document.getElementById('add-task-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const title = document.getElementById('title-input').value;

        const category = document.getElementById('category-select').value || null;

        const localDeadline = document.getElementById('deadline-input').value;

        const deadline = new Date(localDeadline).toISOString().replace('Z', 'Z[UTC]');

        const body = {
            id: crypto.randomUUID(),
            title,
            category,
            deadline
        };

        await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        e.target.reset();
        loadTasks();
        loadNextTask();
        loadCategories();
    });

    // ---------- Helpers ----------
    function formatDeadline(isoString) {
        const cleaned = isoString.replace(/\[.*\]/, '');
        const date = new Date(cleaned);

        const datePart = date.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric'
        });

        const hour = date.getHours().toString().padStart(2, '0');
        const minute = date.getMinutes().toString().padStart(2, '0');
        const timePart = `${hour}:${minute}`;

        return `${datePart} (${timePart})`;
    }

    function updateCountdown() {
        const content = document.getElementById('next-task-content');

        //no tasks
        if (!nextTaskDeadline) {
            content.textContent = 'None!';
            return;
        }

        const diff = nextTaskDeadline - new Date();

        //overdue
        if (diff < 0) {
            content.textContent = `${nextTaskTitle} — overdue`;
            return;
        }

        const minutes = Math.floor(diff / 60000);

        //less than an hour
        if (minutes < 60) {
            if (minutes === 0) {
                content.textContent = `${nextTaskTitle} — due in less than a minute`;
            } else {
                content.textContent = `${nextTaskTitle} — due in ${minutes} minute${minutes === 1 ? '' : 's'}`;
            }
            //1+ days
        } else if (minutes > 60 * 24) {
            const days = Math.floor(minutes / (60 * 24));
            content.textContent = `${nextTaskTitle} — due in ${days} day${days === 1 ? '' : 's'}`;
        } else {
            //one or more hours
            const hours = Math.floor(minutes / 60);
            content.textContent = `${nextTaskTitle} — due in ${hours} hour${hours === 1 ? '' : 's'}`;
        }
    }


    // ---------- Init ----------
    loadTasks();
    loadNextTask();
    loadCategories();
    setInterval(updateCountdown, 60000);
</script>
</body>
</html>
